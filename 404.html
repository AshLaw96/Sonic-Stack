<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Sonic Stack is a Sonic-inspired browser puzzle game where you stack blocks, clear lines and chase high scores.">

    <meta name="theme-color" content="#0d6efd">

    <!-- Open Graph -->
    <meta property="og:title" content="Sonic Stack | 404">
    <meta property="og:description"
        content="Page not found — Sonic Stack, a Sonic-inspired browser puzzle game.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://ashlaw96.github.io/Sonic-Stack/assets/images/og-image.png">
    <meta property="og:url" content="https://ashlaw96.github.io/Sonic-Stack/">

    <title>Sonic Stack | Page Not Found</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180"
        href="assets/favicon/apple-touch-icon.png">

    <link rel="icon"
        type="image/png"
        sizes="32x32"
        href="assets/favicon/favicon-32x32.png">

    <link rel="icon"
        type="image/png"
        sizes="16x16"
        href="assets/favicon/favicon-16x16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            <h1>Sonic Stack</h1>
        </a>

        <div class="header-controls">
            <button
                id="eggman-sound-toggle"
                type="button"
                aria-label="Toggle Dr Eggman sound"
                aria-pressed="true">
                <i class="fa-solid fa-volume-high"></i>
            </button>

            <button
                id="menu-toggle"
                type="button"
                aria-label="Toggle navigation menu"
                aria-expanded="false"
                aria-controls="difficulty">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <nav id="difficulty" aria-label="Navigation">
            <button
                id="return"
                class="current"
                type="button"
                aria-label="Return to homepage">
                Run Away
            </button>
        </nav>
    </header>

    <main>
        <section id="error-wrap">
            <h2 id="error-h2">404</h2>

            <button id="eggman-btn" type="button" aria-label="Dr Eggman sound">
                <img id="drone" src="assets/images/drone.png" alt="Robotnik drone">

                <span id="drone-txt">
                    <i class="fa-solid fa-volume-high"></i>
                </span>
            </button>

            <img id="robotnik" src="assets/images/eggman.png" alt="Dr Eggman stood with his finger pointing up.">

            <p id="error-p">
                Uh-oh! You've dropped into a blocky 404, faster than Sonic catching
                rings! It looks like the page is missing a piece, just like that one
                Tetris block you needed. Try stacking your way back to the homepage
                before Robotnik spots you!
            </p>
        </section>
    </main>

    <footer id="error-foot"></footer>

    <!-- Audio -->
    <audio id="eggman" src="assets/audio/eggman-sound.mp3"></audio>

    <script
        src="https://kit.fontawesome.com/5c8b8e6738.js"
        crossorigin="anonymous">
    </script>

    <script type="module" src="assets/js/main.js"></script>

</body>

</html>
